# Valeurs spécifiques pour PRODUCTION

replicaCount: 3
environment: production

image:
  repository: registry.gitlab.com/votre-namespace/weather-app/backend
  pullPolicy: IfNotPresent
  tag: "latest"

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: weather.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: weather-app-prod-tls
      hosts:
        - weather.example.com

networkPolicy:
  enabled: true

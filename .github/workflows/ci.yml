name: CI - Build & Publish

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  #═══════════════════════════════════════════════════════════════
  # BUILD - Image Docker
  #═══════════════════════════════════════════════════════════════
  
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.tags }}"

  #═══════════════════════════════════════════════════════════════
  # SECURITY SCAN - Trivy
  #═══════════════════════════════════════════════════════════════
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Trivy (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'

  #═══════════════════════════════════════════════════════════════
  # CODE QUALITY - Linting
  #═══════════════════════════════════════════════════════════════
  
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flake8 pylint black
          pip install -r requirements.txt
      
      - name: Run flake8
        run: flake8 app.py --max-line-length=120 --ignore=E501
        continue-on-error: true
      
      - name: Run pylint
        run: pylint app.py --disable=C0111,C0103
        continue-on-error: true
      
      - name: Run black
        run: black --check app.py
        continue-on-error: true

  #═══════════════════════════════════════════════════════════════
  # UNIT TESTS - Pytest
  #═══════════════════════════════════════════════════════════════
  
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml || echo "No tests found"
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  #═══════════════════════════════════════════════════════════════
  # UPDATE MANIFESTS - Pour Argo CD (optionnel)
  #═══════════════════════════════════════════════════════════════
  
  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update image tag in Kustomize
        run: |
          # Déterminer l'environnement
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          else
            ENV="preprod"
          fi
          
          # Mettre à jour le tag de l'image
          cd k8s-argocd/overlays/$ENV
          
          # Utiliser kustomize pour mettre à jour l'image
          cat > kustomization-patch.yaml <<EOF
          images:
            - name: weather-app
              newName: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
              newTag: sha-${{ github.sha }}
          EOF
          
          # Merger avec kustomization.yaml existant
          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
            kustomization.yaml kustomization-patch.yaml > kustomization-new.yaml
          mv kustomization-new.yaml kustomization.yaml
          rm kustomization-patch.yaml
      
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add k8s-argocd/overlays/*/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update image to sha-${{ github.sha }} [skip ci]"
          git push
        continue-on-error: true

  #═══════════════════════════════════════════════════════════════
  # SUMMARY - Résumé du workflow
  #═══════════════════════════════════════════════════════════════
  
  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [build, security-scan, lint, test]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Images disponibles:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Prochaines étapes:" >> $GITHUB_STEP_SUMMARY
          echo "1. L'image est disponible sur GHCR" >> $GITHUB_STEP_SUMMARY
          echo "2. Le scan de sécurité est disponible dans l'onglet Security" >> $GITHUB_STEP_SUMMARY
          echo "3. **Argo CD va détecter le changement et déployer automatiquement**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Pour synchroniser manuellement avec Argo CD:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "argocd app sync weather-app-preprod" >> $GITHUB_STEP_SUMMARY
          echo "# ou" >> $GITHUB_STEP_SUMMARY
          echo "argocd app sync weather-app-prod" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

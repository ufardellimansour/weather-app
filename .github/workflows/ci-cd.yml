name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  #═══════════════════════════════════════════════════════════════
  # BUILD - Images Docker
  #═══════════════════════════════════════════════════════════════
  
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #═══════════════════════════════════════════════════════════════
  # TEST - Sécurité et Qualité
  #═══════════════════════════════════════════════════════════════
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
  
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flake8 pylint black
          pip install -r requirements.txt
      
      - name: Run flake8
        run: flake8 app.py --max-line-length=120 --ignore=E501
        continue-on-error: true
      
      - name: Run pylint
        run: pylint app.py --disable=C0111,C0103
        continue-on-error: true
      
      - name: Run black
        run: black --check app.py
        continue-on-error: true
  
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml || echo "No tests found"
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  #═══════════════════════════════════════════════════════════════
  # DEPLOY - Environnements
  #═══════════════════════════════════════════════════════════════
  
  deploy-preprod:
    name: Deploy to Preprod
    runs-on: ubuntu-latest
    needs: [build, security-scan, lint, test]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: preprod
      url: https://weather-preprod.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'
      
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV
      
      - name: Deploy with Helm
        run: |
          helm upgrade --install weather-app-preprod ./helm/weather-app \
            --namespace weather-preprod \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --set environment=preprod \
            --set replicaCount=1 \
            --set resources.requests.cpu=50m \
            --set resources.requests.memory=64Mi \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=weather-preprod.example.com \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --set secrets.openweatherApiKey=${{ secrets.OPENWEATHER_API_KEY_PREPROD }} \
            --wait \
            --timeout 5m
      
      - name: Verify deployment
        run: |
          kubectl get pods -n weather-preprod
          kubectl rollout status deployment/weather-app-preprod -n weather-preprod
  
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security-scan, lint, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://weather.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'
      
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV
      
      - name: Deploy with Helm
        run: |
          helm upgrade --install weather-app-prod ./helm/weather-app \
            --namespace weather-prod \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --set environment=production \
            --set replicaCount=3 \
            --set resources.requests.cpu=200m \
            --set resources.requests.memory=256Mi \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=3 \
            --set autoscaling.maxReplicas=10 \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=weather.example.com \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --set secrets.openweatherApiKey=${{ secrets.OPENWEATHER_API_KEY_PROD }} \
            --wait \
            --timeout 10m
      
      - name: Verify deployment
        run: |
          kubectl get pods -n weather-prod
          kubectl rollout status deployment/weather-app-prod -n weather-prod
  
  deploy-review:
    name: Deploy Review App
    runs-on: ubuntu-latest
    needs: [build, lint, test]
    if: github.event_name == 'pull_request'
    environment:
      name: review-pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.weather-review.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'
      
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV
      
      - name: Deploy Review App
        run: |
          helm upgrade --install review-pr-${{ github.event.pull_request.number }} ./helm/weather-app \
            --namespace weather-review-pr-${{ github.event.pull_request.number }} \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --set environment=review \
            --set replicaCount=1 \
            --set resources.requests.cpu=50m \
            --set resources.requests.memory=64Mi \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=pr-${{ github.event.pull_request.number }}.weather-review.example.com \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --set secrets.openweatherApiKey=${{ secrets.OPENWEATHER_API_KEY_PREPROD }} \
            --wait \
            --timeout 5m
      
      - name: Comment PR with URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Review app deployed!\n\n📍 URL: https://pr-${{ github.event.pull_request.number }}.weather-review.example.com'
            })

  #═══════════════════════════════════════════════════════════════
  # CLEANUP - Nettoyage Review Apps
  #═══════════════════════════════════════════════════════════════
  
  cleanup-review:
    name: Cleanup Review App
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'
      
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV
      
      - name: Delete Review App
        run: |
          helm uninstall review-pr-${{ github.event.pull_request.number }} \
            --namespace weather-review-pr-${{ github.event.pull_request.number }} || true
          kubectl delete namespace weather-review-pr-${{ github.event.pull_request.number }} || true

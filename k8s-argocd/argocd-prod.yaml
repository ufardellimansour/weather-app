apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/VOTRE-USERNAME/weather-app.git  # Remplacez par votre repo
    targetRevision: main  # Branche main pour production
    path: k8s-argocd/overlays/prod
  
  destination:
    server: https://kubernetes.default.svc
    namespace: weather-prod
  
  syncPolicy:
    # MANUEL pour la production - décommentez automated pour auto-sync
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # Ignoré car géré par HPA

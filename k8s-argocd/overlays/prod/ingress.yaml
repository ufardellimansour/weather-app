apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-app-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod  # Production
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  rules:
  - host: weather.example.com  # Remplacez par votre domaine
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: weather-app-service
            port:
              number: 80
  tls:
  - hosts:
    - weather.example.com
    secretName: weather-app-prod-tls

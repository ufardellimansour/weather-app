version: '3.8'

services:
  weather-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-app:latest
    container_name: weather-app-dev
    ports:
      - "5000:5000"
    environment:
      - OPENWEATHER_API_KEY=demo  # Remplacez par votre clé API
      - PORT=5000
      - FLASK_ENV=development
    volumes:
      # Mount pour le développement à chaud (décommentez pour dev)
      # - ./app.py:/app/app.py
      # - ./templates:/app/templates
      # - ./static:/app/static
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - weather-network

networks:
  weather-network:
    driver: bridge
